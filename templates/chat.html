<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSocket Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: #1a1a1a;
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 700px; margin: 0 auto; padding: 36px 20px; }
  h1 { font-size: 28px; margin: 0 0 22px; }
  .row { display: flex; gap: 10px; }
  input {
    flex: 1; min-width: 0;
    font: inherit; padding: 10px 12px;
    border: 1px solid #d0d0d0; border-radius: 6px; background: #fff;
  }
  input:focus { outline: 2px solid #2e9e5b; outline-offset: -1px; }
  input:disabled { background: #f5f5f5; }
  button {
    font: inherit; color: #fff; border: 0; border-radius: 6px;
    padding: 10px 18px; cursor: pointer; background: #2e9e5b;
  }
  button:disabled { background: #b5b5b5; cursor: not-allowed; }
  #status { margin: 14px 0 10px; font-size: 14px; color: #555; }
  #messages {
    height: 420px; overflow-y: auto;
    border: 1px solid #d0d0d0; border-radius: 6px; background: #fafafa;
    padding: 14px; display: flex; flex-direction: column; gap: 8px;
    margin-bottom: 14px;
  }
  .msg {
    max-width: 78%; padding: 8px 12px; border-radius: 12px;
    overflow-wrap: anywhere;
  }
  .msg.mine { align-self: flex-end; background: #2e9e5b; color: #fff; border-bottom-right-radius: 3px; }
  .msg.theirs { align-self: flex-start; background: #e9e9e9; border-bottom-left-radius: 3px; }
  .msg .who { display: block; font-size: 12px; font-weight: 600; opacity: .7; margin-bottom: 2px; }
  .msg.system { align-self: center; background: none; color: #777; font-size: 13px; padding: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>WebSocket Chat</h1>

  <div class="row">
    <input id="room" type="text" placeholder="Xona nomini kiriting (masalan: p39)" maxlength="30" autocomplete="off" spellcheck="false">
    <button id="joinBtn" type="button">Kirish</button>
  </div>
  <div id="status">Xonaga kirish uchun nom yozing va "Kirish" tugmasini bosing</div>

  <div id="messages"></div>

  <div class="row">
    <input id="text" type="text" placeholder="Xabar yozing..." autocomplete="off" disabled>
    <button id="sendBtn" type="button" disabled>Yuborish</button>
  </div>
</div>

<script>
  // Sahifa Django orqali ochilsa server manzili avtomatik olinadi, aks holda shu IP ishlatiladi.
  const FALLBACK_HOST = "10.30.11.83:8000";
  const HOST = location.protocol.startsWith("http") ? location.host : FALLBACK_HOST;
  const PROTO = location.protocol === "https:" ? "wss://" : "ws://";

  const roomInput = document.getElementById("room");
  const joinBtn = document.getElementById("joinBtn");
  const textInput = document.getElementById("text");
  const sendBtn = document.getElementById("sendBtn");
  const statusEl = document.getElementById("status");
  const box = document.getElementById("messages");

  // Har bir brauzer oynasi uchun tasodifiy ism (server faqat "message" qaytaradi)
  let myName = sessionStorage.getItem("chat_name");
  if (!myName) {
    myName = "Mehmon" + Math.floor(1000 + Math.random() * 9000);
    sessionStorage.setItem("chat_name", myName);
  }

  roomInput.value = localStorage.getItem("chat_room") || "";
  let socket = null;

  function addMessage(kind, text, who) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    if (who) {
      const w = document.createElement("span");
      w.className = "who";
      w.textContent = who;
      el.appendChild(w);
    }
    el.appendChild(document.createTextNode(text));
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  function setConnected(on) {
    textInput.disabled = !on;
    sendBtn.disabled = !on;
    if (on) textInput.focus();
  }

  function join() {
    const room = roomInput.value.trim();
    if (!/^\w+$/.test(room)) {
      statusEl.textContent = "Xona nomida faqat harf, raqam va _ bo'lishi mumkin";
      return;
    }
    if (socket) { socket.onclose = null; socket.close(); }
    box.innerHTML = "";
    setConnected(false);
    localStorage.setItem("chat_room", room);
    statusEl.textContent = "Ulanmoqda...";

    const ws = new WebSocket(PROTO + HOST + "/ws/chat/" + room + "/");
    socket = ws;

    ws.onopen = () => {
      statusEl.textContent = "Xona: " + room + " (siz: " + myName + ")";
      addMessage("system", room + " xonasiga ulandingiz");
      setConnected(true);
    };
    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      const raw = String(data.message ?? "");
      const i = raw.indexOf(": ");
      const who = i > 0 && i <= 20 ? raw.slice(0, i) : "";
      const body = who ? raw.slice(i + 2) : raw;
      const mine = who === myName;
      addMessage(mine ? "mine" : "theirs", body, mine ? "" : who);
    };
    ws.onclose = () => {
      setConnected(false);
      statusEl.textContent = "Ulanish uzildi. Qayta kirish uchun \"Kirish\" ni bosing";
      addMessage("system", "Ulanish uzildi");
    };
    ws.onerror = () => {
      statusEl.textContent = "Xato: server (" + HOST + ") ishlayotganini tekshiring";
    };
  }

  function send() {
    const text = textInput.value.trim();
    if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(JSON.stringify({ message: myName + ": " + text }));
    textInput.value = "";
  }

  joinBtn.addEventListener("click", join);
  sendBtn.addEventListener("click", send);
  roomInput.addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
  textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
